name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

jobs:
  check-rust:
    name: Check Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-target
          key: rust-${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-release-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: cargo fmt --all --check
      # The Tauri build script merges tauri.windows.conf.json, whose
      # externalBin sidecar must exist before any cargo invocation.
      - name: Build Edge TTS sidecar
        working-directory: .
        shell: pwsh
        run: |
          $py = if (Get-Command py -ErrorAction SilentlyContinue) { "py" } else { "python" }
          ./scripts/build-jarvis-edge-tts-sidecar.ps1 -Python $py
      - run: cargo clippy --all-targets --all-features
      - name: Run Rust library tests with Windows manifest
        env:
          TRAFLIX_RUST_TEST_MANIFEST: "1"
        run: cargo test --lib

  check-frontend:
    name: Check Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run test:terminal

  build-and-release:
    name: Build MSI & Release
    runs-on: windows-latest
    needs: [check-rust, check-frontend]

    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.toml -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          $lockVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.lock -Raw),
            '(?ms)name = "traflix-space"\s+version = "([^"]+)"'
          ).Groups[1].Value

          $versions = @($packageVersion, $tauriVersion, $cargoVersion, $lockVersion)
          if ($versions | Where-Object { $_ -ne $tagVersion }) {
            throw "Release tag v$tagVersion does not match project versions: package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }
          Write-Host "Release version verified: v$tagVersion"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-target
          key: rust-${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-release-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - name: Build signed updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY is required to sign desktop updates."
          }
          # Effective build is "npm run tauri build" merged with
          # src-tauri/tauri.windows.conf.json, so the Edge TTS sidecar is
          # regenerated by scripts/tauri-before-build.ps1 before the MSI is bundled.
          npm run tauri -- build --config src-tauri/tauri.windows.conf.json
      - name: Generate Windows update manifest
        run: node scripts/generate-updater-manifest.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            .cargo-target/release/bundle/msi/*.msi
            .cargo-target/release/bundle/msi/*.msi.sig
            .cargo-target/release/bundle/msi/latest.json
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
