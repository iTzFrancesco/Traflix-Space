name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: D:/rust/target

jobs:
  build-and-release:
    name: Build MSI & Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.toml -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value

          $versions = @($packageVersion, $tauriVersion, $cargoVersion)
          if ($versions | Where-Object { $_ -ne $tagVersion }) {
            throw "Release tag v$tagVersion does not match project versions: package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }
          Write-Host "Release version verified: v$tagVersion"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            D:/rust/target
          key: rust-${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-release-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build current Edge TTS sidecar
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-jarvis-edge-tts-sidecar.ps1 -Python python
      - name: Verify Edge TTS sidecar exists
        shell: pwsh
        run: |
          $sidecar = ".\src-tauri\binaries\jarvis-edge-tts-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path -LiteralPath $sidecar)) {
            throw "Missing release sidecar: $sidecar"
          }
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          files: D:/rust/target/release/bundle/msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
