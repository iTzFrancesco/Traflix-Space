name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target

jobs:
  build-and-release:
    name: Build MSI & Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.toml -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          $lockVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.lock -Raw),
            '(?ms)name = "traflix-space"\s+version = "([^"]+)"'
          ).Groups[1].Value

          $versions = @($packageVersion, $tauriVersion, $cargoVersion, $lockVersion)
          if ($versions | Where-Object { $_ -ne $tagVersion }) {
            throw "Release tag v$tagVersion does not match project versions: package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }
          Write-Host "Release version verified: v$tagVersion"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/cargo-target
          key: rust-${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-release-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # tauri.windows.conf.json runs scripts/tauri-before-build.ps1, which
      # regenerates the current persistent Edge TTS sidecar and builds the UI.
      - run: npm run tauri build
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/cargo-target/release/bundle/msi/*.msi
          generate_release_notes: true
          fail_on_unmatched_files: true
