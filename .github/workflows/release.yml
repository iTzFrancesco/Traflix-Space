name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

jobs:
  build-and-release:
    name: Build MSI & Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.toml -Raw),
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          $lockVersion = [regex]::Match(
            (Get-Content src-tauri/Cargo.lock -Raw),
            '(?ms)name = "traflix-space"\s+version = "([^"]+)"'
          ).Groups[1].Value

          $versions = @($packageVersion, $tauriVersion, $cargoVersion, $lockVersion)
          if ($versions | Where-Object { $_ -ne $tagVersion }) {
            throw "Release tag v$tagVersion does not match project versions: package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }
          Write-Host "Release version verified: v$tagVersion"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-target
          key: rust-${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-release-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      # Keep the release as a draft so the MSI, sidecar, and signatures can be
      # reviewed before latest.json becomes available to installed apps.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Traflix Space ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: false
          tauriScript: npm run tauri
