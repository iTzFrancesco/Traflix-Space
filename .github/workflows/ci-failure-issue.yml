name: CI Failure Tracker

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  issues: write

jobs:
  create-issue:
    if: >
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const runId = run.id;
            const branch = run.head_branch;
            const sha = run.head_sha;
            const commitMsg = run.head_commit
              ? run.head_commit.message.split('\n')[0]
              : '(see commit)';

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const failedJobs = jobs.jobs.filter(j => j.conclusion === 'failure');
            const jobNames = failedJobs
              .map(j => `- **${j.name}** ([logs](${j.html_url}))`)
              .join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
            });

            const alreadyReported = existing.find(i =>
              i.body && i.body.includes(`Run ID: ${runId}`)
            );
            if (alreadyReported) {
              console.log(`Issue already exists: ${alreadyReported.html_url}`);
              return;
            }

            const body = [
              `## CI Workflow Failed`,
              ``,
              `**Workflow:** ${run.name}`,
              `**Branch:** \`${branch}\``,
              `**Commit:** [${sha.slice(0, 7)}](${run.head_repository?.html_url || ''}/commit/${sha}) — ${commitMsg}`,
              `**Run ID:** ${runId}`,
              ``,
              `### Failed Jobs:`,
              jobNames || `_(no job details available)_`,
              ``,
              `[View full run](${run.html_url})`,
              ``,
              `---`,
              `_Auto-created by CI Failure Tracker._`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI fallito: ${branch} — ${commitMsg.slice(0, 60)}`,
              body,
              labels: ['ci-failure', 'auto-generated'],
            });
