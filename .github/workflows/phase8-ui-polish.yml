name: Phase 8 UI Polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'feat/jarvis-conversational-agent-control'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic polish
        run: python scripts/phase8_ui_polish.py
      - name: Commit polish
        shell: pwsh
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/workspace/TerminalPane.tsx
            git commit -m "style(ui): polish terminal panes"
            git push origin HEAD:${{ github.head_ref }}
          }
