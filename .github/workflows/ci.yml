name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
        working-directory: .
      - run: npm run build
        working-directory: .
      - name: Apply known Clippy source fixes
        shell: pwsh
        working-directory: .
        run: |
          $parser = Get-Content 'src-tauri/src/terminal_engine/parser.rs' -Raw
          $parser = $parser.Replace("c >= '\x40' && c <= '\x7E'", "('\x40'..='\x7E').contains(&c)")
          Set-Content 'src-tauri/src/terminal_engine/parser.rs' $parser -NoNewline

          $session = Get-Content 'src-tauri/src/terminal_engine/session.rs' -Raw
          $session = $session.Replace(".split(|c: char| c == '\r' || c == '\n')", ".split(['\r', '\n'])")
          Set-Content 'src-tauri/src/terminal_engine/session.rs' $session -NoNewline

          $manager = Get-Content 'src-tauri/src/terminal_engine/mod.rs' -Raw
          $manager = $manager.Replace('.args(["-C", &cwd, "branch", "--show-current"])', '.args(["-C", cwd, "branch", "--show-current"])')
          Set-Content 'src-tauri/src/terminal_engine/mod.rs' $manager -NoNewline
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Persist source fixes on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: .
        run: |
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src-tauri/src/terminal_engine/parser.rs src-tauri/src/terminal_engine/session.rs src-tauri/src/terminal_engine/mod.rs
            git commit -m "fix: satisfy strict Rust clippy"
            git push origin HEAD:main
          }
      - name: Verify strict Rust lint
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-rust:
    name: Test Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: cargo test

  build:
    name: Build (Windows MSI)
    runs-on: windows-latest
    needs: [lint-rust, test-rust]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: traflix-space-windows
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
