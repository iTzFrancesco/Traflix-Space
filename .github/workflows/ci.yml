name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

permissions:
  contents: read

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: cargo fmt --all --check
      # The Tauri build script merges tauri.windows.conf.json, whose
      # externalBin sidecar must exist before any cargo invocation.
      - name: Build Edge TTS sidecar
        working-directory: .
        shell: pwsh
        run: |
          $py = if (Get-Command py -ErrorAction SilentlyContinue) { "py" } else { "python" }
          ./scripts/build-jarvis-edge-tts-sidecar.ps1 -Python $py
      - run: cargo clippy --all-targets --all-features

  test-rust:
    name: Test Rust
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm run test:jarvis
        working-directory: .
      # The Tauri build script merges tauri.windows.conf.json, whose
      # externalBin sidecar must exist before any cargo invocation.
      - name: Build Edge TTS sidecar
        working-directory: .
        shell: pwsh
        run: |
          $py = if (Get-Command py -ErrorAction SilentlyContinue) { "py" } else { "python" }
          ./scripts/build-jarvis-edge-tts-sidecar.ps1 -Python $py
      - name: Run Rust library tests with Windows manifest
        env:
          TRAFLIX_RUST_TEST_MANIFEST: "1"
        run: cargo test --lib

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - run: npm run build

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - run: npm run test:terminal

  build:
    name: Build (Windows MSI)
    runs-on: windows-latest
    needs: [lint-rust, test-rust, lint-frontend, test-frontend]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-target
          key: rust-${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run tauri -- build --config src-tauri/tauri.windows.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: traflix-space-windows
          path: ${{ github.workspace }}/.cargo-target/release/bundle/msi/*.msi
          if-no-files-found: error
