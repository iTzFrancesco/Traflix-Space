[package]
name = "traflix-space"
version = "1.7.8"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-pty = "0.3.0"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vt100 = "0.15"
crossbeam-channel = "0.5"
parking_lot = "0.12"
dashmap = "6"
portable-pty = "0.8"
notify = { version = "7", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
rodio = "0.19"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Reserved seam for the approved local keyword-spotting adapter. The MVP keeps
# this disabled until the sherpa-onnx dependency, model and redistribution
# terms are verified and bundled explicitly.
wake-word-sherpa = []
